services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./src:/var/www
    depends_on:
      - php
    networks:
      - homecraft

  php:
    build:
      context: ./docker/php
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - homecraft

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-homecraft}
      MYSQL_USER: ${DB_USERNAME:-homecraft}
      MYSQL_PASSWORD: ${DB_PASSWORD:-homecraft}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3308:3306"
    networks:
      - homecraft

  redis:
    image: redis:7-alpine
    networks:
      - homecraft

  pma:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - homecraft

volumes:
  mysql_data:

networks:
  homecraft:
    driver: bridge
